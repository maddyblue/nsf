<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --font-family: sans-serif;

        --color-primary: hsl(190, 97%, 38%);
        --color-primary-focus: hsl(190, 97%, 30%);
        --color-link: hsl(210, 66%, 52%);
        --color-link-focus: hsl(210, 66%, 47%);
        --color-background: hsl(0, 0%, 10%);
        --color-gray-1: hsl(0, 0%, 85%);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --color-primary: hsl(190, 97%, 30%);
          --color-primary-focus: hsl(190, 97%, 38%);
          --color-link: hsl(210, 66%, 47%);
          --color-link-focus: hsl(210, 66%, 52%);
          --color-background: hsl(0, 0%, 100%);
          --color-gray-1: hsl(0, 0%, 15%);
        }
      }

      body {
        margin: 0 auto;
        background-color: var(--color-background);
        font-family: var(--font-family);
        font-size: 1.1rem;
        color: var(--color-gray-1);
        line-height: 1.4;
        max-width: 62.5rem;
      }
      a {
        text-decoration: none;
        color: var(--color-link);
      }
      a:focus,
      a:hover {
        color: var(--color-link-focus);
      }
      a:visited {
        color: var(--color-primary);
      }
      a:visited:hover {
        color: var(--color-primary-focus);
      }
      img {
        max-width: 100%;
      }
      footer {
        margin-top: 2rem;
      }
    </style>
    <title>nsf sampler</title>
  </head>
  <body>
    <button id="replay">replay</button>
    <button id="stop">stop</button>
    <form id="form" onwheel>
      <fieldset>
        <legend>pulse 1</legend>
        <fieldset>
          <legend>envelope</legend>
          <div>
            <label
              >duty:
              <input type="number" min="0" max="3" value="1" id="p1-env-duty"
            /></label>
          </div>
          <div>
            <label
              >loop: <input type="checkbox" id="p1-env-loop" checked
            /></label>
          </div>
          <div>
            <label
              >constant volume:
              <input type="checkbox" id="p1-env-constant-volume"
            /></label>
          </div>
          <div>
            <label
              >volume:
              <input
                type="number"
                min="0"
                max="15"
                value="10"
                id="p1-env-volume"
            /></label>
          </div>
          <div>
            <label
              >length:
              <input
                type="number"
                min="0"
                max="31"
                value="1"
                id="p1-env-length"
            /></label>
          </div>
        </fieldset>
        <fieldset>
          <legend>sweep</legend>
          <div>
            <label
              >enable: <input type="checkbox" id="p1-sweep-enable"
            /></label>
          </div>
          <div>
            <label
              >period:
              <input
                type="number"
                min="0"
                max="7"
                value="7"
                id="p1-sweep-period"
            /></label>
          </div>
          <div>
            <label
              >shift:
              <input
                type="number"
                min="0"
                max="7"
                value="0"
                id="p1-sweep-shift"
            /></label>
          </div>
          <div>
            <label
              >negate: <input type="checkbox" id="p1-sweep-negate"
            /></label>
          </div>
        </fieldset>
        <fieldset>
          <legend>timer</legend>
          <div>
            <label
              >length:
              <input
                type="number"
                min="0"
                max="2047"
                value="250"
                id="p1-timer-length"
            /></label>
          </div>
          <div>
            <label
              >counter:
              <input
                type="number"
                min="0"
                max="31"
                value="10"
                id="p1-timer-counter"
            /></label>
          </div>
        </fieldset>
      </fieldset>
    </form>

    <button id="extract">extract</button>
    <div id="extracted" style="font-size: 50%"></div>
    <div id="canvas"></div>

    <script src="/static/data.js"></script>

    <script>
      const CpuClock = 236250000 / 11 / 12;
      const form = document.getElementById("form");
      const extracted = document.getElementById("extracted");
      const canvasDiv = document.getElementById("canvas");

      let MaxSeconds = 40;
      canvas.addEventListener("wheel", (event) => {
        MaxSeconds += event.deltaY * 0.1;
        MaxSeconds = Math.max(MaxSeconds, 1);
        drawChart(TESTDATA);
      });

      const Integers = [
        "env-duty",
        "env-volume",
        "env-length",
        "sweep-period",
        "sweep-shift",
        "timer-length",
        "timer-counter",
      ];
      const Booleans = [
        "env-loop",
        "env-constant-volume",
        "sweep-enable",
        "sweep-negate",
      ];

      document.getElementById("replay").addEventListener("click", formChanged);
      form.addEventListener("change", formChanged);
      form.addEventListener("wheel", formChanged);
      function formChanged() {
        const data = {};
        Object.assign(data, getPulse("p1"));
        fetchAudio(data);
      }
      document.getElementById("extract").addEventListener("click", extract);
      document.getElementById("stop").addEventListener("click", () => {
        context.close();
        context = new AudioContext();
      });

      drawChart(TESTDATA);

      // Handler for the extract button. Calls the extract api on an nsf file and populates the page
      // with its extracted apu configs.
      async function extract(data) {
        const url = "/api/extract";
        try {
          const resp = await fetch(url);
          if (!resp.ok) {
            console.error(resp.status);
            return;
          }
          const data = await resp.json();
          const divs = data.map((d, idx) => {
            const div = document.createElement("div");
            const text = document.createTextNode(
              `${idx + 1}: ${JSON.stringify(d)}`
            );
            div.appendChild(text);
            div.addEventListener("click", () => {
              loadData(d);
            });
            return div;
          });
          extracted.replaceChildren(...divs);

          drawChart(data);
        } catch (err) {
          console.error(err.message);
        }
      }

      function drawChart(data) {
        // Move earlier samples first.
        data.sort((a, b) => a.Times[0].Start - b.Times[0].Start);

        const tooltip = document.createElement("div");

        const canvas = document.createElement("canvas");
        canvas.height = 300;
        canvas.width = 1000;
        canvas.style = "cursor: pointer";
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "white";

        // Ignore playback after this many seconds.
        if (!MaxSeconds) {
          MaxSeconds = 30;
        }
        const maxTotalTicks = CpuClock * MaxSeconds;
        let totalTicks = 0;
        for ({ Data, Times } of data) {
          last = Times[Times.length - 1];
          totalTicks = Math.max(totalTicks, last.End);
        }
        totalTicks = Math.min(maxTotalTicks, totalTicks);

        let idx = 0;
        const LINEHEIGHT = 15;
        for ({ Data, Times } of data) {
          for ({ Start, End } of Times) {
            if (Start > totalTicks) {
              continue;
            }
            const start = (Start / totalTicks) * canvas.width;
            const end = (End / totalTicks) * canvas.width;
            const width = Math.max(end - start, 0);
            ctx.fillRect(start, idx * LINEHEIGHT, width, LINEHEIGHT);
          }

          idx++;
        }

        canvas.addEventListener("click", (event) => {
          const idx = Math.floor(event.offsetY / LINEHEIGHT);
          const row = data[idx];
          if (!row) {
            return;
          }
          loadData(row.Data);
        });
        canvas.addEventListener("mousemove", (event) => {
          const idx = Math.floor(event.offsetY / LINEHEIGHT);
          const row = data[idx];
          if (!row) {
            return;
          }
          tooltip.innerText = JSON.stringify(row.Data);
        });
        canvasDiv.replaceChildren(canvas, tooltip);
      }

      // Click handler for apu configs. Loads and plays the apu config.
      function loadData(data) {
        function setPulse(idx) {
          const prefix = idx + "-";
          for (name of Integers) {
            let value = data[prefix + name];
            if (name === "timer-length" && value == 0) {
              value = 250;
            }
            document.getElementById(prefix + name).value = value;
          }
          for (name of Booleans) {
            document.getElementById(prefix + name).checked =
              data[prefix + name];
          }
        }

        setPulse("p1");
        formChanged();
      }

      // For the specified apu config, fetches audio data and plays it.
      async function fetchAudio(data) {
        const url = "/api/generate";
        try {
          const resp = await fetch(url, {
            method: "POST",
            body: JSON.stringify(data),
          });
          if (!resp.ok) {
            console.error(resp.status);
            return;
          }
          const samples = await resp.json();
          if (samples.length < 1) {
            return;
          }

          context.close();
          context = new AudioContext();
          playSound(samples);
        } catch (err) {
          console.error(err.message);
        }
      }

      let context = new AudioContext();
      function playSound(arr) {
        var buf = new Float32Array(arr.length);
        for (var i = 0; i < arr.length; i++) buf[i] = arr[i];
        var buffer = context.createBuffer(1, buf.length, context.sampleRate);
        buffer.copyToChannel(buf, 0);
        var source = context.createBufferSource();
        source.buffer = buffer;
        source.connect(context.destination);
        source.start(0);
      }

      function getPulse(idx) {
        const data = {};
        const prefix = idx + "-";
        for (name of Integers) {
          data[prefix + name] = parseInt(
            document.getElementById(prefix + name).value
          );
        }
        for (name of Booleans) {
          data[prefix + name] = document.getElementById(prefix + name).checked;
        }
        return data;
      }
    </script>
  </body>
</html>
